name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build public release
        env:
          SITE_URL: https://pivdoss.github.io/novo-borodino-production/
          SITE_INDEXABLE: 'true'
        run: pnpm run build
      - name: Adapt project-site asset paths
        shell: bash
        run: |
          find dist -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.xml' -o -name '*.txt' \) -print0 | xargs -0 sed -i 's#"/images/#"/novo-borodino-production/images/#g; s#"/assets/#"/novo-borodino-production/assets/#g; s#href="/#href="/novo-borodino-production/#g; s#content="https://pivdoss.github.io/"#content="https://pivdoss.github.io/novo-borodino-production/"#g'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

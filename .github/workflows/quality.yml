name: Site quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Build, SEO and dependency audit
    runs-on: ubuntu-latest
    env:
      # CI deliberately uses a syntactically valid non-production origin.
      # A real SITE_URL is supplied only by the production deployment.
      SITE_URL: https://ci.example.ru
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6.0.8
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
      - run: pnpm run build
      - run: pnpm run check:seo
      - run: pnpm run check:external-links
      - run: pnpm run check:mobile-safety
      - run: pnpm run check:runtime-contracts
      - run: pnpm run check:page

  container_scan:
    name: Container image scan
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build production image
        run: >-
          docker build --target production
          --build-arg SITE_URL=https://ci.example.ru
          --tag novo-borodino:${{ github.sha }} .
      - name: Scan production image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: novo-borodino:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

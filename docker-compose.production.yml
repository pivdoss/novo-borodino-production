# Production-контур. Запускать только с .env.production:
# docker compose --env-file .env.production -f docker-compose.production.yml up -d --build
# Порты наружу не публикуются: HTTPS reverse proxy/хостинг должен подключаться к сети novo-borodino-private.
name: novo-borodino-production

services:
  web:
    build:
      context: .
      target: production
      args:
        SITE_URL: ${SITE_URL:?Set the real HTTPS SITE_URL in .env.production}
        VITE_METRIKA_ID: ${VITE_METRIKA_ID:-}
    environment:
      NODE_ENV: production
    expose:
      - "80"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /var/log/nginx
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 192m
    cpus: "0.50"
    pids_limit: 100
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - private

networks:
  private:
    name: novo-borodino-private

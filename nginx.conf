server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    absolute_redirect off;
    client_max_body_size 32k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; script-src 'self' https://mc.yandex.ru https://mc.yandex.com; style-src 'self'; img-src 'self' data: https://mc.yandex.ru https://mc.yandex.com; font-src 'self'; connect-src 'self' https://mc.yandex.ru https://mc.yandex.com; frame-src https://yandex.ru; manifest-src 'self'" always;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    # No upstream, admin panel, contact form endpoint or application database.
    location ~ ^/(?:admin|api)(?:/|$) { return 404; }
    location /assets/ { try_files $uri =404; expires 1y; }
    location /images/ { try_files $uri =404; expires 7d; }
    location / { try_files $uri $uri/ =404; expires -1; }
    error_page 404 /404.html;
}
